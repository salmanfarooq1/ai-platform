name: Frontend
defaults:
  run:
    working-directory: ui
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup
      with:
        groups: main
    - id: scope
      name: Decide required checks
      working-directory: .
      env:
        CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: poetry run python scripts/ci/change_scope.py
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        groups: dev
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - run: npm ci
    - name: ESLint (no warnings allowed)
      run: npm run lint
    - name: The generated API types match docs/api/openapi.json
      run: 'npm run gen:api

        git diff --exit-code -- src/api/schema.d.ts

        '
    - name: Design tokens match tokens.json (drift check)
      run: npm run tokens:check
    - name: Copy check (headline, dashes, banned words, claims)
      run: npm run copy-check
    needs:
    - changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        groups: dev
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - run: npm ci
    - name: tsc --noEmit (strict)
      run: npx tsc --noEmit
    needs:
    - changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        groups: dev
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - run: npm ci
    - name: Vitest and Testing Library
      run: npm test -- --run
    needs:
    - changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        groups: dev
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - run: npm ci
    - name: Type check and Vite build
      run: npm run build
    - name: Code splitting (each route is a chunk, no GSAP or WebGL under /app)
      run: npm run chunk-report
    - uses: actions/upload-artifact@v4
      with:
        name: ui-dist
        path: ui/dist
        retention-days: 7
    needs:
    - changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
  e2e:
    runs-on: ubuntu-latest
    needs:
    - changes
    - build
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
        env:
          POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey-bundle:9.1.3@sha256:dd30c59c2b2a598e83308095220a31d6d93d64c40a839c702cb1e98c8e220660
        ports:
        - 6379:6379
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        groups: dev
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - run: npm ci
    - name: Install Chromium for Playwright
      run: npx playwright install --with-deps chromium
    - uses: actions/download-artifact@v4
      with:
        name: ui-dist
        path: ui/dist
    - name: Playwright (allow and deny, landing, axe, walkthrough, drawer, palette, preview, parity)
      run: npx playwright test
      env:
        CI: 'true'
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-traces
        path: ui/test-results
        retention-days: 7
    if: ${{ needs.changes.outputs.frontend == 'true' }}
  lighthouse:
    runs-on: ubuntu-latest
    needs:
    - changes
    - build
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        groups: dev
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - run: npm ci
      working-directory: ui
    - name: Install Chromium for Playwright (used as Lighthouse's browser)
      run: npx playwright install --with-deps chromium
      working-directory: ui
    - name: Lighthouse desktop performance
      run: scripts/verify/lighthouse.sh "$RUNNER_TEMP/lighthouse.json"
      working-directory: .
    if: ${{ needs.changes.outputs.frontend == 'true' }}
'on':
  push:
    branches:
    - main
  pull_request: null
env:
  DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
  DO_NOT_TRACK: '1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
