name: Frontend

on:
  push:
    branches: [main]
    paths: ["ui/**", "api/**", "gateway/**", "core/**", "migrations/**", "docs/openapi.json", "scripts/e2e/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["ui/**", "api/**", "gateway/**", "core/**", "migrations/**", "docs/openapi.json", "scripts/e2e/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: ui

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: ESLint (no warnings allowed)
        run: npm run lint
      - name: The generated API types match docs/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Design tokens match tokens.json (drift check)
        # tokens.css is generated by Style Dictionary from ui/tokens/tokens.json. Fail if the committed file differs.
        run: npm run tokens:check
      - name: Copy check (headline, dashes, banned words, claims)
        run: npm run copy-check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: tsc --noEmit (strict)
        run: npx tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Vitest and Testing Library
        run: npm test -- --run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Type check and Vite build
        run: npm run build
      - name: Code splitting (each route is a chunk, no GSAP or WebGL under /app)
        run: npm run chunk-report
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  e2e:
    # Playwright against the real API with the LLM and embedding fakes (scripts/e2e/serve.py),
    # real Postgres and Redis, and the built UI served by `vite preview`.
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
        working-directory: .
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-
      - name: Install Python dependencies
        run: poetry install --with dev
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Playwright (allow and deny, landing, axe, walkthrough, drawer, palette, preview, parity)
        run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: ui/test-results
          retention-days: 7

  lighthouse:
    # The landing page needs no API. The score target is 85 or more on desktop.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Install Chromium for Playwright (used as Lighthouse's browser)
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Lighthouse desktop performance
        run: scripts/verify/lighthouse.sh "$RUNNER_TEMP/lighthouse.json"
        working-directory: .
