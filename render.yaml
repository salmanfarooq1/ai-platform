# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys api/main.py (via Dockerfile) as a free-tier web service.
# Free instances are 512MB RAM / 0.1 CPU and spin down after 15 min idle,
# cold-starting on the next request — expected on this plan, not a bug.
#
# Usage: Render dashboard -> New -> Blueprint -> connect this repo. Render
# reads this file, creates the service, and prompts for every envVar marked
# `sync: false` (masked input, stored as a Render secret, never committed).
services:
  - type: web
    name: ai-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODE
        value: public-preview
      # Single worker: FEATURES["reranker_enabled"] is already off in public-preview
      # mode, but the DB pool itself is sized (config.py DATABASE_CONFIG
      # pool_size=5) assuming one worker process on a 512MB instance.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The app connects as the non-privileged role (gap_app), so row-level security applies to it.
      - key: DATABASE_URL
        sync: false
      # The owner role. Used only by `alembic upgrade head` in the container start command.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: ai-platform-ui
    runtime: docker
    dockerfilePath: ./ui/Dockerfile.ui
    dockerContext: ./ui
    plan: free
    envVars:
      # Relative, not the backend's absolute URL: nginx.conf proxies /api/*
      # to the backend server-side, so the browser only ever talks to this
      # one origin. Keeps this a single public URL instead of two.
      - key: VITE_API_URL
        value: /api
      # API key of the preview tenant (scopes: query, kb:read, agent). nginx adds it to /api/ calls
      # server-side, so browsers never hold it. Create it with scripts/admin/identity.py create-key.
      - key: PREVIEW_API_KEY
        sync: false
