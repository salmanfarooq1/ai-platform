[project]
name = "ai-platform"
version = "0.1.0"
description = "Production-grade AI backend platform"
authors = [
    {name = "salmanfarooq1",email = "salmanfarooq673@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp (>=3.13.3,<4.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.137.0,<0.138.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "litellm (>=1.89.2,<2.0.0)",
    "redis[hiredis] (>=8.0.1,<9.0.0)",
    "groq (>=1.5.0,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "langgraph (>=1.2.0,<2.0.0)",
    "langchain-core (>=1.4.0,<2.0.0)",
    "langchain-litellm (>=0.7.0,<0.8.0)",
    "mcp (>=2.0.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "opentelemetry-sdk (>=1.45.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.66b0,<0.67)",
    "opentelemetry-exporter-otlp-proto-http (>=1.45.0,<2.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "boto3 (>=1.43.108,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
# Kept out of [project.dependencies] so that `poetry install --only main` - what
# the Dockerfile runs - produces an image without torch. sentence-transformers
# is only reached through the cross-encoder reranker, which FEATURES
# ["reranker_enabled"] disables in public-preview mode to stay inside 512MB of RAM.
rerank = [
    "sentence-transformers (>=5.6.0,<6.0.0)",
]

# Only imported by scripts/ (labs, corpus building, eval plots), which the
# production image does not copy.
labs = [
    "matplotlib (>=3.10.8,<4.0.0)",
    "deepeval (>=4.0.8,<5.0.0)",
]

dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.5.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "asgi-lifespan (>=2.1.0,<3.0.0)",
    "types-psycopg2 (>=2.9.21.20260911,<3.0.0.0)",
    "types-requests (>=2.33.0.20260906,<3.0.0.0)",
    "hypothesis (>=6.168.3,<7.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
# The deepeval pytest plugin (labs group) replaces pytest's skip summary with its own rich
# output, which crashes on skip reasons that contain brackets. The tests do not use it.
addopts = "-p no:deepeval"
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests against a real test database/Redis instance",
    "e2e: full-stack tests that exercise the API end-to-end",
]

[tool.coverage.run]
source = ["api", "core", "gateway", "ports", "adapters"]
omit = ["*/tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length handled by formatter, not linter


[tool.mypy]
python_version = "3.11"
files = ["api", "core", "gateway", "ports", "adapters", "config.py"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
# Non-strict baseline. mypy 2.x turns some of these on by default, so they are explicit.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
exclude = ["^migrations/"]

# Strict for the new modules (Sprint 002), and for the ports and adapters (Sprint 006: they are the contracts).
# Everything else is non-strict for now.
[[tool.mypy.overrides]]
module = ["core.settings", "api.errors", "api.observability", "api.versioning", "ports", "ports.*", "adapters", "adapters.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
