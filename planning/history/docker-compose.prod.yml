# Production compose file. Builds the API from the local Dockerfile
# and wires it to Postgres + Redis via an internal Docker network.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
#
# Environment variables (set in .env.prod or pass via -e):
#   MODE=public-preview (or prod)
#   REDIS_URL=redis://...
#   POSTGRES_PASSWORD=<choose one; required, no default, URL-safe characters only>
#   APP_DB_PASSWORD=<password of the gap_app role; required, URL-safe characters only>
#   GROQ_API_KEY=gsk_...

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - MODE=${MODE:-public-preview}
      # The app connects as the non-privileged gap_app role (row-level security applies to it).
      # Migrations run as the owner role.
      - DATABASE_URL=postgresql://gap_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/rag_platform
      - MIGRATION_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rag_platform
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - WEB_CONCURRENCY=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: "rag_platform"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No ports exposed — API connects via Docker network hostname "postgres"

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No ports exposed — API connects via Docker network hostname "redis"

volumes:
  pgdata:
  redis_data:
