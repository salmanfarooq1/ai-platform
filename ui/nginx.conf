# Serves the built UI and proxies the API under /v1, so the browser talks to one origin and the session cookie
# (HttpOnly, SameSite=Strict) stays same-site. The proxy adds no credential: the browser signs in at POST /v1/session.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass https://ai-platform-6udm.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host ai-platform-6udm.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
