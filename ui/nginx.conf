server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the backend Render service so the browser only ever sees
    # this one origin, no CORS, no second public URL to share.
    location /api/ {
        proxy_pass https://ai-platform-6udm.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host ai-platform-6udm.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
