# nginx template: the nginx image renders this with envsubst at container start (see Dockerfile.ui),
# replacing the PREVIEW_API_KEY placeholder (and nothing else). Only variables that exist in the
# environment are substituted, so nginx's own $uri, $host and friends are left alone.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the backend Render service so the browser only ever sees
    # this one origin, no CORS, no second public URL to share.
    #
    # The preview API key is added here, on the server, so the browser never holds it. It is a Render
    # secret on this service (PREVIEW_API_KEY), scoped to the preview tenant. Any Authorization header the
    # browser sends is replaced, so a visitor cannot use this proxy with a key of their own choosing
    # or learn anything about the real one.
    location /api/ {
        proxy_pass https://ai-platform-6udm.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host ai-platform-6udm.onrender.com;
        proxy_set_header Authorization "Bearer ${PREVIEW_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
